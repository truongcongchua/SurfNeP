- id: fgets-strlen
  why: "Đọc bằng fgets rồi gửi strlen: mất dữ liệu sau byte 0x00"
  replace: [["        int n = read(STDIN_FILENO, buffer, sizeof(buffer));\n        if (n <= 0) break;", "        if (fgets(buffer, sizeof(buffer), stdin) == NULL) break;\n        int n = strlen(buffer);"]]
- id: exit-zero-on-refused
  why: "Không kết nối được vẫn thoát mã 0"
  replace: [["        perror(\"connect\");\n        close(client_socket);\n        exit(EXIT_FAILURE);", "        perror(\"connect\");\n        close(client_socket);\n        exit(0);"]]
- id: send-whole-buffer
  why: "Gửi cả bộ đệm 4096 byte thay vì đúng n byte vừa đọc"
  replace: [["if (send(client_socket, buffer, n, 0) == -1) {", "if (send(client_socket, buffer, sizeof(buffer), 0) == -1) {"]]
