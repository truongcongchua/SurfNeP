- id: greeting-strlen
  why: "Đọc câu chào bằng fgets + strlen: hỏng khi có byte 0x00"
  replace:
    - ["    while ((n = fread(buf, 1, sizeof buf, f)) > 0)\n        if (send_all(c, buf, n) < 0) break;", "    while (fgets(buf, sizeof buf, f))\n        if (send_all(c, buf, strlen(buf)) < 0) break;\n    (void)n;"]
    - ["#include <stdlib.h>", "#include <stdlib.h>\n#include <string.h>"]
- id: greeting-first-block-only
  why: "Chỉ gửi khối 4096 byte đầu của câu chào"
  replace: [["    while ((n = fread(buf, 1, sizeof buf, f)) > 0)\n        if (send_all(c, buf, n) < 0) break;", "    if ((n = fread(buf, 1, sizeof buf, f)) > 0)\n        send_all(c, buf, n);"]]
- id: greeting-no-fclose
  why: "Quên fclose tệp câu chào: rò rỉ fd mỗi client"
  replace: [["        if (send_all(c, buf, n) < 0) break;\n    fclose(f);", "        if (send_all(c, buf, n) < 0) break;"]]
- id: log-no-close
  why: "Quên đóng tệp log: rò rỉ fd mỗi client"
  replace: [["        if (log >= 0) close(log);\n", ""]]
- id: log-strnlen
  why: "Ghi log bằng độ dài chuỗi (dừng ở byte 0x00)"
  replace: [["write(log, buf, (size_t)n) != n", "write(log, buf, strnlen(buf, (size_t)n)) < 0"], ["#include <stdlib.h>", "#include <stdlib.h>\n#include <string.h>"]]
- id: log-adds-newline
  why: "Ghi thêm '\\n' sau dữ liệu của mỗi client"
  replace: [["        if (log >= 0) close(log);\n", "        if (log >= 0) { write(log, \"\\n\", 1); close(log); }\n"]]
