# Bản sai sinh từ solution.c; xem docs/TEST-DESIGN.md
- id: sigpipe
  why: 'send không MSG_NOSIGNAL: gửi tới client đã RST làm server chết'
  replace:
  - - static void send_str(int fd, const char *s) { send(fd, s, strlen(s), MSG_NOSIGNAL); }
    - static void send_str(int fd, const char *s) { send(fd, s, strlen(s), 0); }
- id: id-buffer-8
  why: 'Bộ đệm id chỉ 8 byte: id dài bị từ chối'
  replace:
  - - char id[64];
    - char id[8];
- id: one-line-per-recv
  why: Mỗi lần recv chỉ xử lý một dòng
  replace:
  - - while ((nl = strchr(start, '\n'))) {
    - if ((nl = strchr(start, '\n'))) {
- id: keep-cr
