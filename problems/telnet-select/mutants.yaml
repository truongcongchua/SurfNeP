# Sinh bởi script; xem docs/TEST-DESIGN.md
- id: strlen-count
  why: 'Đếm n bằng strlen: sai khi kết quả có byte 0x00'
  replace:
  - - '        len = fread(data, 1, len, f);

      '
    - "        len = fread(data, 1, len, f);\n        data[len] = 0;\n        len = strlen(data);\n"
- id: login-prefix-match
  why: 'So khớp tiền tố: ''admin adm'' cũng đăng nhập được'
  replace:
  - - ok = strcmp(row, line) == 0;
    - ok = strncmp(row, line, strlen(line)) == 0;
- id: no-fclose-accounts
  why: 'Quên fclose(accounts.txt): rò rỉ một fd mỗi lần đăng nhập'
  replace:
  - - "    fclose(f);\n    return ok;"
    - '    return ok;'
- id: exit-case-insensitive
  why: So 'exit' không phân biệt hoa thường
  replace:
  - - '!strcmp(line, "exit")'
    - '!strcasecmp(line, "exit")'
  - - '#include <string.h>'
    - '#include <string.h>

      #include <strings.h>'
- id: output-capped-4096
  why: Chỉ gửi tối đa 4096 byte kết quả
  replace:
  - - '        data = malloc(len + 1);

      '
    - "        if (len > 4096) len = 4096;\n        data = malloc(len + 1);\n"
- id: no-stderr-redirect
  why: Không chuyển hướng stderr (2>&1)
  replace:
  - - snprintf(shell, sizeof shell, "{ %s\n} > %s 2>&1", cmd, out);
    - snprintf(shell, sizeof shell, "{ %s\n} > %s", cmd, out);
- id: last-command-only
  why: 'Không bọc dòng lệnh: chỉ lệnh cuối của ''a; b'' bị chuyển hướng'
  replace:
  - - snprintf(shell, sizeof shell, "{ %s\n} > %s 2>&1", cmd, out);
    - snprintf(shell, sizeof shell, "%s > %s 2>&1", cmd, out);
- id: small-line-buffer
  why: 'Bộ đệm dòng 64 byte: dòng đăng nhập + lệnh dính nhau bị cắt'
  replace:
  - - '#define BUF_SIZE 4096'
    - '#define BUF_SIZE 64'
