- id: minus-one-closes-client
  why: "Coi recv trả -1 (chưa có dữ liệu) là lỗi và đóng client"
  replace: [["            } else if (byte_received == 0) {", "            } else {"]]
- id: client-blocking
  why: "Quên đặt socket client non-blocking: recv chặn cả server"
  replace: [["                ioctl(client, FIONBIO, &io_mode);  // recv không chặn nữa\n", ""]]
- id: never-close
  why: "Client đóng thì quên close(): rò rỉ fd"
  replace: [["                close(client_sockets[i]);\n                client_sockets[i] =", "                client_sockets[i] ="]]
- id: small-client-table
  why: "Mảng client chỉ 8 phần tử"
  replace: [["#define MAX_CLIENTS 512", "#define MAX_CLIENTS 8"]]
