# Bản sai sinh từ solution.c; xem docs/TEST-DESIGN.md
- id: sigpipe
  why: 'send không MSG_NOSIGNAL: gửi tới client đã RST làm server chết'
  replace:
  - - static void send_str(int fd, const char *s) { send(fd, s, strlen(s), MSG_NOSIGNAL); }
    - static void send_str(int fd, const char *s) { send(fd, s, strlen(s), 0); }
- id: id-buffer-8
  why: 'Bộ đệm id chỉ 8 byte: id dài bị từ chối'
  replace:
  - - char id[64];
    - char id[8];
- id: one-line-per-recv
  why: Mỗi lần recv chỉ xử lý một dòng
  replace:
  - - while ((nl = strchr(start, '\n'))) {
    - if ((nl = strchr(start, '\n'))) {
- id: keep-cr
  why: Không bỏ '\r' cuối dòng
  replace:
  - - '    if (n && line[n - 1] == ''\r'') line[--n] = 0;

      '
    - ''
- id: name-with-space
  why: Chấp nhận tên có dấu cách
  replace:
  - - valid_word(sep + 2)
    - sep[2]
- id: echo-to-self
  why: Gửi lại tin cho chính người gửi
  replace:
  - - if (j != i && cl[j].id[0])
    - if (cl[j].id[0])
- id: send-to-unregistered
  why: Gửi tin cho cả client chưa đăng ký
  replace:
  - - if (j != i && cl[j].id[0])
    - if (j != i)
- id: short-msg-buffer
  why: Bộ đệm tin 256 byte
  replace:
  - - char msg[BUF_SIZE + 96];
    - char msg[256];
- id: keep-registration
  why: Chỗ mới không xoá id cũ
  replace:
  - - '                cl[nfds].id[0] = 0;

      '
    - ''
- id: small-table
  why: Chỉ 16 fd
  replace:
  - - '#define MAX_FDS 256'
    - '#define MAX_FDS 16'
