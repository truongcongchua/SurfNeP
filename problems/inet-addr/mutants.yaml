- id: mask-172-too-narrow
  why: "Dùng /16 cho 172.16.0.0/12: 172.17-172.31 bị coi là PUBLIC"
  replace: [["(a & 0xFFF00000u) == 0xAC100000u", "(a & 0xFFFF0000u) == 0xAC100000u"]]
- id: mask-172-too-wide
  why: "Dùng /8 cho 172.16.0.0/12"
  replace: [["(a & 0xFFF00000u) == 0xAC100000u", "(a & 0xFF000000u) == 0xAC000000u"]]
- id: mask-192-too-wide
  why: "Coi mọi 192.x.x.x là PRIVATE"
  replace: [["(a & 0xFFFF0000u) == 0xC0A80000u", "(a & 0xFF000000u) == 0xC0000000u"]]
- id: loopback-only-one
  why: "Chỉ 127.0.0.1 là LOOPBACK, quên cả dải /8"
  replace: [["(a & 0xFF000000u) == 0x7F000000u", "a == 0x7F000001u"]]
- id: no-zero-pad
  why: "In 0x%X thay vì 0x%08X"
  replace: [["0x%08X", "0x%X"]]
- id: lowercase-hex
  why: "In hex chữ thường"
  replace: [["0x%08X", "0x%08x"]]
- id: keep-cr
  why: "Chỉ cắt \\n, giữ lại \\r của dòng CRLF"
  replace: [['line[strcspn(line, "\r\n")] = 0;', 'line[strcspn(line, "\n")] = 0;']]
- id: no-255-special-case
  why: "Coi mọi INADDR_NONE là lỗi: địa chỉ hợp lệ 255.255.255.255 thành INVALID"
  replace: [["if (in.s_addr == INADDR_NONE && strcmp(line, \"255.255.255.255\") != 0) {", "if (in.s_addr == INADDR_NONE) {"]]
- id: zero-is-invalid
  why: "Coi giá trị 0 là lỗi (nhầm với inet_aton trả 0): 0.0.0.0 thành INVALID"
  replace: [["if (in.s_addr == INADDR_NONE && strcmp(line, \"255.255.255.255\") != 0) {", "if (in.s_addr == 0 || (in.s_addr == INADDR_NONE && strcmp(line, \"255.255.255.255\") != 0)) {"]]
- id: echo-input
  why: "In lại xâu đầu vào thay vì inet_ntoa (10.1 phải in 10.0.0.1)"
  replace: [["inet_ntoa(in), host, kind(host)", "line, host, kind(host)"]]
- id: line-buffer-15
  why: "Bộ đệm vừa khít 15 ký tự: không còn chỗ cho \\n nên dòng dài nhất bị cắt làm hai"
  replace: [["char line[256];", "char line[16];"]]
- id: special-before-private-wrong
  why: "Quên SPECIAL cho 255.255.255.255"
  replace: [["a == 0 || a == 0xFFFFFFFFu", "a == 0"]]
