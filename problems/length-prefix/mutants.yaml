- id: signed-length
  why: "Đọc độ dài vào int có dấu: L = 0x80000000 thành số âm, lọt qua kiểm tra L > 65536"
  replace: [["        unsigned int len = ntohl(netlen);", "        int len = (int)ntohl(netlen);"], ["        unsigned int have = 0;", "        int have = 0;"], ["        for (unsigned int i = 0; i < len; i++)", "        for (int i = 0; i < len; i++)"]]
- id: max-off-by-one
  why: "Từ chối L = 65536 (so sánh >=)"
  replace: [["if (len > MAX_LEN) return;", "if (len >= MAX_LEN) return;"]]
- id: no-ntohl
  why: "Quên ntohl: đọc độ dài theo thứ tự host"
  replace: [["unsigned int len = ntohl(netlen);", "unsigned int len = netlen;"]]
- id: single-recv-data
  why: "Một lần recv cho phần dữ liệu (không lặp tới đủ L byte)"
  replace: [["        while (have < len) {\n            int k = recv(client, data + have, len - have, 0);\n            if (k <= 0) return;\n            have += k;\n        }", "        if (len > 0 && recv(client, data, len, 0) <= 0) return;"]]
- id: single-recv-header
  why: "Một lần recv cho 4 byte độ dài (header đến từng byte thì sai)"
  replace: [["            int k = recv(client, (char *)&netlen + got, 4 - got, 0);", "            int k = recv(client, &netlen, 4, 0);\n            if (k > 0) k = 4;"]]
- id: upper-too-wide
  why: "Đổi cả ký tự ngoài a–z (dải 'a'..'~')"
  replace: [["if (data[i] >= 'a' && data[i] <= 'z')", "if (data[i] >= 'a' && data[i] <= '~')"]]
- id: echo-length-wrong
  why: "Gửi lại độ dài theo thứ tự host"
  replace: [["send(client, &netlen, 4, 0);", "send(client, &len, 4, 0);"]]
- id: no-close
  why: "Quên close(client) sau khi phục vụ xong"
  replace: [["        serve(client);\n        close(client);", "        serve(client);"]]
- id: small-buffer
  why: "Bộ đệm dữ liệu 4096 byte nhưng vẫn nhận L tới 65536"
  replace: [["        if (len > MAX_LEN) return;         // sai giao thức: đóng kết nối", "        if (len > MAX_LEN) return;\n        if (len > 4096) len = 4096;"]]
