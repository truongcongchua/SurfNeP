- id: maxfd-not-updated
  why: "Không cập nhật max_fd: select chỉ theo dõi socket lắng nghe"
  replace: [["            if (client_list[i] > max_fd) max_fd = client_list[i];\n", ""]]
- id: select-nfds-off-by-one
  why: "Gọi select(max_fd, ...) thay vì max_fd + 1: fd lớn nhất (client mới nhất) không bao giờ được đọc"
  replace: [["select(max_fd + 1, &read_fds, NULL, NULL, NULL)", "select(max_fd, &read_fds, NULL, NULL, NULL)"]]
- id: closed-fd-kept
  why: "Đóng socket nhưng không xoá khỏi danh sách theo dõi (như select_server.c gốc)"
  replace: [["                client_list[i] = client_list[number_of_clients - 1];\n                number_of_clients--;\n                i--;\n", ""]]
- id: never-close
  why: "Client đóng thì chỉ bỏ khỏi danh sách, quên close(): rò rỉ fd"
  replace: [["                close(client_socket);\n                client_list[i] =", "                client_list[i] ="]]
- id: small-client-table
  why: "Mảng client chỉ 8 phần tử"
  replace: [["#define MAX_CLIENTS 512", "#define MAX_CLIENTS 8"]]
- id: fd-set-not-rebuilt
  why: "Chỉ FD_SET client lúc accept, không dựng lại fd_set mỗi vòng (select đã ghi đè)"
  replace: [["        for (int i = 0; i < number_of_clients; i++) {\n            FD_SET(client_list[i], &read_fds);", "        for (int i = 0; i < number_of_clients; i++) {"]]
