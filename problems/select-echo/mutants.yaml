- id: maxfd-not-updated
  why: "Không cập nhật maxfd: select chỉ theo dõi socket lắng nghe"
  replace: [["            if (clients[i] > maxfd) maxfd = clients[i];\n", ""]]
- id: select-nfds-off-by-one
  why: "Gọi select(maxfd, ...) thay vì maxfd + 1: fd lớn nhất (client mới nhất) không bao giờ được đọc"
  replace: [["select(maxfd + 1, &rd, NULL, NULL, NULL)", "select(maxfd, &rd, NULL, NULL, NULL)"]]
- id: closed-fd-kept
  why: "Đóng socket nhưng không xoá khỏi danh sách theo dõi"
  replace: [["                close(clients[i]);\n                clients[i--] = clients[--n];", "                close(clients[i]);"]]
- id: never-close
  why: "Client đóng thì chỉ bỏ khỏi danh sách, quên close(): rò rỉ fd"
  replace: [["                close(clients[i]);\n                clients[i--] = clients[--n];", "                clients[i--] = clients[--n];"]]
- id: sigpipe-ignore-send-error
  why: "Không MSG_NOSIGNAL và bỏ qua lỗi send"
  replace:
    - ["ssize_t k = send(fd, buf, n, MSG_NOSIGNAL);", "ssize_t k = send(fd, buf, n, 0);"]
    - ["if (k <= 0 || send_all(clients[i], buf, (size_t)k) < 0) {", "if (k <= 0 || (send_all(clients[i], buf, (size_t)k), 0)) {"]
- id: small-client-table
  why: "Mảng client chỉ 8 phần tử"
  replace: [["#define MAX_CLIENTS 512", "#define MAX_CLIENTS 8"]]
