- id: no-fclose
  why: "Quên đóng tệp log: rò rỉ fd mỗi client (và dữ liệu nằm lại trong bộ đệm)"
  replace: [["        if (log != NULL) fclose(log);  // fclose đẩy dữ liệu xuống tệp ngay\n", ""]]
- id: no-close-client
  why: "Quên close(client): rò rỉ fd mỗi client"
  replace: [["        close(client);\n", ""]]
- id: log-strlen
  why: "Ghi log bằng độ dài chuỗi (dừng ở byte 0x00)"
  replace: [["if (log != NULL) fwrite(buffer, 1, bytes_received, log);", "if (log != NULL) { buffer[bytes_received < 4096 ? bytes_received : 4095] = 0; fputs(buffer, log); }"]]
- id: log-whole-buffer
  why: "Ghi sizeof(buffer) byte thay vì số byte nhận được: thừa byte rác"
  replace: [["fwrite(buffer, 1, bytes_received, log)", "fwrite(buffer, 1, sizeof(buffer), log)"]]
- id: log-adds-newline
  why: "Ghi thêm '\\n' sau dữ liệu của mỗi client"
  replace: [["        if (log != NULL) fclose(log);", "        if (log != NULL) { fputc('\\n', log); fclose(log); }"]]
- id: log-overwrite
  why: "Mở log bằng \"wb\": ghi đè dữ liệu client trước"
  replace: [["fopen(argv[2], \"ab\")", "fopen(argv[2], \"wb\")"]]
- id: single-recv
  why: "Chỉ recv một lần mỗi client: mất phần dữ liệu đến sau"
  replace: [["        while (0 == 0) {\n            int bytes_received", "        for (int once = 0; once < 1; once++) {\n            int bytes_received"]]
