# Bản sai sinh từ solution.c; xem docs/TEST-DESIGN.md
- id: allow-plus-sign
  why: Chấp nhận dấu '+' trước số
  replace:
  - - "    if (*s == '-') {"
    - "    if (*s == '+') s++;\n    if (*s == '-') {"
- id: no-range-check
  why: 'Không kiểm tra khoảng int64: số quá lớn bị tràn thay vì ERROR syntax'
  replace:
  - - '        if (v > (limit - d) / 10) return 0;  // v * 10 + d sẽ vượt giới hạn'
    - '        (void)limit;'
- id: count-everything
  why: COUNT đếm cả yêu cầu lỗi
  replace:
  - - 'static void handle(const char *req, Peer *p, char *out, size_t cap) {

      '
    - "static void handle(const char *req, Peer *p, char *out, size_t cap) {\n    if (p && strcmp(req, \"COUNT\")) p->count++;\n"
  - - "    if (p) p->count++;\n    snprintf(out, cap, \"%lld\", r);"
    - '    snprintf(out, cap, "%lld", r);'
- id: floor-division
  why: Chia làm tròn xuống (kiểu Python) thay vì về 0
  replace:
  - - ': op[0] == ''/'' ? x / y : x % y;'
    - ': op[0] == ''/'' ? (x - (((x % y) + y) % y)) / y : (((x % y) + y) % y);'
- id: shared-counter
  why: Người gửi xác định chỉ bằng IP
  replace:
  - - ' && peers[i].addr.sin_port == a->sin_port'
    - ''
- id: int32
  why: Dùng số 32 bit (int)
  replace:
  - - '    *out = neg ? (long long)(0 - v) : (long long)v;'
    - '    *out = neg ? (int)(0 - v) : (int)v;'
- id: loose-spaces
  why: Cho phép thiếu/thừa dấu cách (sscanf)
  replace:
  - - "    if (!s1 || !s2 || strchr(s2 + 1, ' ') || s1 - req >= (long)sizeof a || s2 - s1 - 1 != 1 ||\n        strlen(s2 + 1) >= sizeof b) {\n        snprintf(out, cap, \"ERROR syntax\");\n        return;\n\
      \    }"
    - "    { long long xx, yy; char o; if (sscanf(req, \"%lld %c %lld\", &xx, &o, &yy) == 3 && strchr(\"+-*/%\", o) && !((o == '/' || o == '%') && yy == 0)) { if (p) p->count++; snprintf(out, cap, \"%lld\"\
      , o == '+' ? xx + yy : o == '-' ? xx - yy : o == '*' ? xx * yy : o == '/' ? xx / yy : xx % yy); return; } }\n    if (!s1 || !s2 || strchr(s2 + 1, ' ') || s1 - req >= (long)sizeof a || s2 - s1 - 1\
      \ != 1 ||\n        strlen(s2 + 1) >= sizeof b) {\n        snprintf(out, cap, \"ERROR syntax\");\n        return;\n    }"
