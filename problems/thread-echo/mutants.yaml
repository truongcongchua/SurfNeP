- id: worker-no-close
  why: "Luồng không close(client_socket): rò rỉ fd, client không thấy server đóng"
  replace: [["    close(client_socket);\n    return NULL;", "    return NULL;"]]
- id: serve-in-main-thread
  why: "Gọi handle_client trực tiếp trong luồng chính (không thật sự đồng thời)"
  replace: [["        pthread_create(&thread, NULL, handle_client, arg);\n        pthread_detach(thread);", "        handle_client(arg);"]]
- id: send-ignores-count
  why: "Gửi cả bộ đệm thay vì đúng số byte recv trả về"
  replace: [["send(client_socket, buffer, bytes_received, 0);", "send(client_socket, buffer, sizeof(buffer), 0);"]]
- id: join-instead-of-detach
  why: "pthread_join ngay sau pthread_create: luồng chính chờ client này xong mới accept tiếp"
  replace: [["pthread_detach(thread);", "pthread_join(thread, NULL);"]]
