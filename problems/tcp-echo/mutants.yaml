- id: no-close-client
  why: "Quên close(client): rò rỉ fd, client không bao giờ thấy server đóng"
  replace: [["        close(client);\n    }\n}", "    }\n}"]]
- id: recv-zero-not-handled
  why: "Không dừng khi recv trả 0 (client đóng): kẹt vòng lặp vô hạn"
  replace: [["if (bytes_received <= 0) {", "if (bytes_received < 0) {"]]
- id: send-ignores-count
  why: "Gửi cả bộ đệm thay vì đúng số byte recv trả về"
  replace: [["send(client, buffer, bytes_received, 0);", "send(client, buffer, sizeof(buffer), 0);"]]
- id: send-strlen
  why: "Dùng strlen(buffer) làm độ dài: hỏng khi dữ liệu có byte 0x00"
  replace: [["send(client, buffer, bytes_received, 0);", "buffer[bytes_received < 1024 ? bytes_received : 1023] = 0;\n            send(client, buffer, strlen(buffer), 0);"]]
- id: serve-one-client
  why: "Phục vụ xong một client thì thoát (thiếu vòng lặp accept)"
  replace: [["        close(client);\n    }\n}", "        close(client);\n        break;\n    }\n}"]]
