- id: full-not-closed
  why: "Gửi FULL nhưng quên close(): client bị từ chối treo, rò rỉ fd"
  replace: [["                    send(c, \"FULL\\n\", 5, 0);\n                    close(c);", "                    send(c, \"FULL\\n\", 5, 0);"]]
- id: keep-cr
  why: "Không bỏ '\\r' cuối dòng: 'COUNT\\r' bị coi là dòng thường"
  replace: [["    if (n > 0 && line[n - 1] == '\\r') line[n - 1] = 0;\n", ""]]
- id: one-line-per-recv
  why: "Mỗi lần recv chỉ xử lý dòng đầu tiên"
  replace: [["while (alive && (nl = strchr(start, '\\n')) != NULL) {", "if (alive && (nl = strchr(start, '\\n')) != NULL) {"]]
- id: drop-partial-line
  why: "Bỏ phần dòng dở dang cuối bộ đệm thay vì giữ cho lần recv sau"
  replace: [["                client_len[i] -= start - buf;\n                memmove(buf, start, client_len[i]);", "                client_len[i] = 0;"]]
- id: small-buffer
  why: "Bộ đệm dòng 256 byte"
  replace: [["#define BUF_SIZE 4096", "#define BUF_SIZE 256"]]
- id: quit-keeps-connection
  why: "QUIT gửi BYE nhưng không đóng kết nối"
  replace: [["        send(client_fd[i], \"BYE\\n\", 4, 0);\n        return 0;", "        send(client_fd[i], \"BYE\\n\", 4, 0);\n        return 1;"]]
- id: count-off-by-one
  why: "Giới hạn so sánh > thay vì >="
  replace: [["if (active >= limit || slot < 0) {", "if (active > limit || slot < 0) {"]]
- id: client-table-too-small
  why: "Bảng client chỉ 16 chỗ (không đạt N = 50)"
  replace: [["#define MAX_CLIENTS 64", "#define MAX_CLIENTS 16"]]
- id: leak-on-abrupt-close
  why: "Chỉ giảm bộ đếm khi QUIT, quên khi client đóng đột ngột"
  replace: [["    if (strcmp(line, \"QUIT\") == 0) {\n        send(client_fd[i], \"BYE\\n\", 4, 0);\n        return 0;", "    if (strcmp(line, \"QUIT\") == 0) {\n        send(client_fd[i], \"BYE\\n\", 4, 0);\n        active--;\n        return 0;"], ["                client_fd[i] = -1;\n                active--;", "                client_fd[i] = -1;"]]
