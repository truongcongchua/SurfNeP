- id: parent-keeps-client-fd
  why: "Cha quên close(client) sau fork: rò rỉ fd, client không nhận được FIN khi con đóng"
  replace: [["        // Tiến trình cha\n        close(client);", "        // Tiến trình cha"]]
- id: reap-only-one
  why: "Handler SIGCHLD chỉ waitpid một lần: nhiều con chết cùng lúc thì còn zombie"
  replace: [["while (waitpid(-1, NULL, WNOHANG) > 0);", "waitpid(-1, NULL, WNOHANG);"]]
- id: no-reaper
  why: "Không cài handler SIGCHLD"
  replace: [["    signal(SIGCHLD, signal_handler);\n", ""]]
- id: child-falls-through
  why: "Con không exit sau khi phục vụ xong: chạy tiếp vòng lặp accept của cha"
  replace: [["            close(client);\n            exit(0);", "            close(client);"]]
