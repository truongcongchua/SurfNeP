- id: gpa-truncate
  why: "Ép kiểu thẳng điểm*100 sang số nguyên (cắt 0.29 thành 28)"
  replace: [["(unsigned short)(gpa * 100 + 0.5)", "(unsigned short)(gpa * 100)"]]
- id: keep-cr
  why: "Chỉ bỏ '\\n', giữ '\\r' của dòng CRLF"
  replace: [["        name[strcspn(name, \"\\r\\n\")] = 0;", "        name[strcspn(name, \"\\n\")] = 0;"]]
- id: name-buffer-64
  why: "Bộ đệm tên 64 byte: tên 100 byte bị cắt"
  replace: [["char mssv_s[64], name[512], dob[64], gpa_s[64];", "char mssv_s[64], name[64], dob[64], gpa_s[64];"]]
- id: continue-after-error
  why: "Nhận ERROR vẫn gửi tiếp"
  replace: [["        if (strcmp(reply, \"OK\") != 0) break;  // ERROR: server sẽ đóng kết nối\n", ""]]
- id: single-recv-reply
  why: "Đọc phản hồi bằng một lần recv (phản hồi bị cắt thì in thiếu)"
  replace: [["            if (recv(client_socket, &c, 1, 0) <= 0) {", "            if (n > 0 || recv(client_socket, reply, sizeof(reply) - 1, 0) <= 0) {"]]
- id: name-len-chars
  why: "Không gửi trường name_len (quên 1 byte độ dài)"
  replace: [["        record[p++] = nlen;\n", ""]]
