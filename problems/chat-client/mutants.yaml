- id: eof-ignored
  why: "stdin EOF (read trả 0) mà vẫn theo dõi stdin: lặp vô hạn 100% CPU, không bao giờ đóng kết nối"
  replace: [["            if (n <= 0) {\n                break;  // EOF (Ctrl+D): đóng kết nối và thoát\n            }", "            if (n <= 0) {\n                continue;\n            }"]]
- id: stdout-unflushed
  why: "fwrite ra stdout có đệm mà không fflush: phần dòng chưa có '\\n' không hiện ra ngay"
  replace: [["            fflush(stdout);                              // in ngay cả khi chưa có '\\n'\n", ""]]
- id: strlen-stdout
  why: 'In tin bằng printf("%s"): mất byte sau 0x00'
  replace: [["            fwrite(buffer, 1, bytes_received, stdout);  // đúng từng byte (có thể có 0x00)", "            buffer[bytes_received < 4096 ? bytes_received : 4095] = 0;\n            printf(\"%s\", buffer);"]]
- id: fgets-stdin
  why: "Đọc stdin bằng fgets: nửa dòng chưa có '\\n' không được gửi, mất byte sau 0x00"
  replace: [["            int n = read(STDIN_FILENO, buffer, sizeof(buffer));", "            int n = fgets(buffer, sizeof(buffer), stdin) ? (int)strlen(buffer) : 0;"]]
- id: server-close-not-handled
  why: "recv trả 0 (server đóng) mà không thoát"
  replace: [["            if (bytes_received <= 0) {\n                break;  // 0: server đóng; -1: lỗi (ví dụ RST)\n            }", "            if (bytes_received < 0) {\n                break;\n            }"]]
- id: max-fd-wrong
  why: "Gọi select(max_fd, ...) thay vì max_fd + 1: không bao giờ thấy dữ liệu từ socket"
  replace: [["select(max_fd + 1, &read_fds, NULL, NULL, NULL)", "select(max_fd, &read_fds, NULL, NULL, NULL)"]]
- {id: recv-error-exit-1, why: "recv trả -1 (server bị reset) thì thoát mã 1 thay vì 0", replace: [["                break;  // 0: server đóng; -1: lỗi (ví dụ RST)", "                if (bytes_received < 0) exit(1);\n                break;"]]}
