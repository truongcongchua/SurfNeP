# Gợi ý theo bậc cho từng bài: mỗi bài một danh sách, hiện lần lượt từ trên xuống.
# Bậc 1 = hướng nghĩ (chưa lộ cách làm) -> bậc 2 = hàm/cấu trúc cần dùng -> bậc 3 = chi tiết dễ sai nhất.
# Không viết lời giải đầy đủ. Bài thi thử (mock-*) không có gợi ý.

byte-order:
  - |-
    Hãy hỏi: "một số 16 hoặc 32 bit nằm trong bộ nhớ thành những byte nào, theo thứ tự nào?". Phần 1 là thứ tự **mạng**, phần 2 là cách **máy này** đọc lại chính dãy byte đó.
  - |-
    Đổi sang thứ tự mạng bằng `htons`/`htonl`, rồi `memcpy` kết quả vào mảng `unsigned char` để đọc từng byte. Phần 2 chính là giá trị mà `htons`/`htonl` trả về (đọc ngược lại dãy byte đó trên máy little-endian).
  - |-
    Kiểm tra định dạng **trước** khi đổi: đúng 2 từ, kiểu là `u16` hoặc `u32`, số không âm, không có ký tự thừa, và nằm trong khoảng của kiểu (`u16` ≤ 65535). Duyệt từng ký tự: chỉ nhận `0`–`9`, cộng dồn `v = v * 10 + (c - '0')` vào `unsigned long long` (thôi cộng khi đã vượt 32 bit), đừng dùng `atoi`. In hex bằng `%02X`.

inet-addr:
  - |-
    Việc khó nhất là nhận biết địa chỉ hợp lệ, nhưng bạn không cần tự viết bộ phân tích: thư viện đã có hàm trả lời "hợp lệ hay không" và hàm in lại dạng chuẩn.
  - |-
    `inet_addr(s)` trả `s_addr` (thứ tự mạng), hoặc `INADDR_NONE` nếu xâu sai; `inet_ntoa` in lại dạng chuẩn. Muốn so với mặt nạ phải `ntohl` trước.
  - |-
    Dạng LOẠI xét **theo thứ tự** trong bảng (loopback trước, rồi private, rồi special). `172.16.0.0/12` là `(a & 0xFFF00000) == 0xAC100000`. In giá trị 32 bit bằng `0x%08X` **sau** `ntohl`. Nhớ `"255.255.255.255"` hợp lệ nhưng `inet_addr` cũng trả `INADDR_NONE` cho nó: so riêng bằng `strcmp`.

domain2ip:
  - |-
    Đây là bài "dùng đúng một hàm thư viện": tên miền → danh sách địa chỉ. Chú ý kết quả là một **danh sách liên kết**, không phải một địa chỉ.
  - |-
    Đặt `hints.ai_family = AF_INET` và `hints.ai_socktype = SOCK_STREAM`, gọi `getaddrinfo(name, NULL, &hints, &res)`, rồi duyệt `res->ai_next`. Với mỗi nút, ép `ai_addr` sang `struct sockaddr_in *` và dùng `inet_ntop`.
  - |-
    `SOCK_STREAM` giúp mỗi địa chỉ chỉ xuất hiện **một lần** (nếu bỏ trống sẽ lặp lại cho TCP, UDP, RAW). Hàm trả khác `0` là thất bại → in `NOT_FOUND`. Nhớ `freeaddrinfo(res)` và bỏ dòng trống/ký tự xuống dòng ở cuối tên.

tcp-accept-close:
  - |-
    Làm đúng theo thứ tự bốn hàm: `socket` → `bind` → `listen` → `accept`. Mỗi hàm sinh ra thứ mà hàm sau cần, nên đảo thứ tự là sai.
  - |-
    `socket` trả về socket **nghe**. `bind` cần một `struct sockaddr_in` đã điền `sin_family = AF_INET`, `sin_port = htons(atoi(argv[1]))`, `sin_addr.s_addr = INADDR_ANY`. `listen(listener, 5)`. `accept(listener, NULL, NULL)` **chờ** tới khi có client rồi trả về một socket **mới**.
  - |-
    Quên `htons` thì server nghe nhầm cổng (bộ chấm báo `NL`). Quên `listen` thì client không kết nối được. Cuối cùng `close` cả socket client lẫn socket nghe rồi `return 0`.

tcp-hello-loop:
  - |-
    Bài này là bài trước cộng thêm một **vòng lặp**: cứ `accept` được một client thì chào rồi đóng, rồi quay lại `accept`. Biến đếm số client phải sống qua các vòng lặp.
  - |-
    `int count = 0;` **trước** vòng `while`. Trong vòng: `accept`, `count++`, `sprintf(message, "Hello, client %d!\n", count)`, `send(client, message, strlen(message), 0)`, `close(client)`.
  - |-
    Gửi `strlen(message)` byte, không phải `strlen + 1` (thừa byte `'\0'`). Mỗi client phải `close(client)`, nếu không sau khoảng 250 client server hết file descriptor. Đừng `close(listener)` trong vòng lặp.

tcp-echo-once:
  - |-
    Đây là `tcp_server.c` của thầy với cổng lấy từ dòng lệnh: sau `accept` chỉ cần `recv` một lần rồi `send` lại.
  - |-
    `char buffer[1024]; int bytes_received = recv(client, buffer, sizeof(buffer), 0);` rồi `send(client, buffer, bytes_received, 0);`. `recv` trả `-1` thì `perror` và thoát.
  - |-
    Độ dài khi `send` là **số byte `recv` trả về**, không phải `strlen(buffer)` (dữ liệu có thể chứa `0x00`) và không phải `sizeof(buffer)`.

tcp-echo:
  - |-
    Hai vòng lặp lồng nhau: vòng ngoài chờ client mới, vòng trong phục vụ **một** client đến khi nó đóng.
  - |-
    `socket` → (`setsockopt SO_REUSEADDR`) → `bind` → `listen` → vòng `accept`. Trong vòng trong: `recv` vào bộ đệm, rồi `send` lại đúng số byte nhận được. Xem thẻ **Vòng đời socket TCP**.
  - |-
    Dùng số byte `recv` trả về (không dùng `strlen`: dữ liệu có thể chứa `0x00`). Gọi `recv` → `send` trong vòng lặp cho tới khi `recv` trả `<= 0` (không chỉ một lần như `tcp_server.c`). `recv == 0` là client đã đóng: `close(fd)` rồi quay lại `accept`, đừng thoát server.

stdin-forward:
  - |-
    Đây là `cat` viết bằng hàm mức thấp. Câu hỏi cần trả lời: `read` cho bạn biết gì sau mỗi lần gọi, và bạn phải ghi lại bao nhiêu byte?
  - |-
    Vòng lặp `read(STDIN_FILENO, buffer, sizeof(buffer))` rồi `write(STDOUT_FILENO, buffer, n)`. `read` trả `0` khi hết stdin và `-1` khi lỗi, cả hai đều dừng vòng lặp (`n <= 0`).
  - |-
    Ghi **đúng `n` byte** (không `sizeof(buffer)`, không `strlen`: dữ liệu có thể chứa `0x00`). Đừng dùng `fgets`/`fread`: chúng chờ đủ dòng hoặc đủ bộ đệm nên dữ liệu đến chậm bị giữ lại.

tcp-client-send:
  - |-
    Đây là nửa "kết nối và gửi" của bài tcp-client-stdin: bạn chủ động `connect`, gửi dữ liệu, rồi đóng. Không cần nhận gì.
  - |-
    `socket` → `sockaddr_in` (`inet_addr(argv[1])`, `htons(atoi(argv[2]))`) → `connect` (kiểm tra kết quả) → `send(s, argv[3], strlen(argv[3]), 0)` rồi `send(s, "\n", 1, 0)` → `close`. Hai lần `send` vẫn là một luồng byte với server. Sai số tham số: in `Usage` ra `stderr`, thoát mã 1 **trước** khi tạo socket.
  - |-
    Thông điệp tới 50 000 ký tự: đừng ghép `thông điệp + "\n"` vào mảng cố định nhỏ (`snprintf` sẽ cắt). Gửi đúng `strlen(argv[3])` byte (không `+ 1`, không `\0`).

tcp-client-stdin:
  - |-
    Ngược với server: bạn chủ động `connect`. Phần đáng nghĩ là **khi nào** gửi: ngay khi có một dòng, không đợi hết stdin.
  - |-
    `socket` → điền `sockaddr_in` bằng `inet_addr` và `htons(port)` như `tcp_client.c` → `connect` (kiểm tra kết quả) → vòng đọc stdin bằng `read(STDIN_FILENO, ...)` và `send` ngay. EOF thì `close` và `exit(0)`.
  - |-
    Gửi **đúng** số byte `read` trả về (đừng dùng `fgets` + `strlen`: dữ liệu có thể chứa `0x00`). `connect` thất bại: in lỗi ra `stderr` bằng `perror`, `exit(1)`. Nếu stdout bị đệm thì không liên quan, nhưng đừng in gì lên stdout làm lẫn dữ liệu.

tcp-send-file:
  - |-
    Đây là nửa "gửi câu chào" của `tcp-greeting-log`: mỗi client kết nối thì bạn đọc một tệp rồi đẩy nó xuống socket. Câu hỏi: `read` cho bạn biết gì sau mỗi lần gọi, và bạn phải `send` bao nhiêu byte?
  - |-
    Mỗi client: `fd = open(argv[2], O_RDONLY)` (kiểm tra `-1`), vòng `n = read(fd, buffer, sizeof(buffer))` + `send(client, buffer, n, 0)` đến khi `read` trả `<= 0`, rồi `close(fd)` và `close(client)`.
  - |-
    Gửi **đúng `n` byte** `read` trả về (không `sizeof(buffer)`, không `strlen`: tệp có thể chứa `0x00`). Mở lại tệp **mỗi lần** có client mới và nhớ `close(fd)` + `close(client)` mỗi lần, kẻo hết 256 fd sau 250 client.

tcp-append-log:
  - |-
    Đây là nửa "ghi log" của `tcp-greeting-log`: đọc dữ liệu từ socket như `tcp-echo`, nhưng thay vì `send` lại thì ghi vào tệp. Hai câu hỏi: mở tệp bằng chế độ nào để không mất dữ liệu client trước, và khi nào dữ liệu thật sự nằm trong tệp?
  - |-
    Mỗi client: `fd = open(argv[2], O_WRONLY | O_CREAT | O_APPEND, 0644)`, vòng `recv` + `write(fd, buffer, n)` đến khi `recv <= 0`, rồi `close(fd)` và `close(client)`.
  - |-
    `O_APPEND` ghi nối vào cuối (thiếu nó thì ghi đè từ đầu tệp, còn `O_TRUNC` cắt cụt tệp), `O_CREAT` tạo tệp nếu chưa có và cần đối số thứ ba (quyền, ví dụ `0644`). Ghi đúng `n` byte `recv` trả về (không `strlen`, không `sizeof(buffer)`). `write` đưa dữ liệu vào tệp ngay; quên `close(fd)` thì rò rỉ fd.

tcp-greeting-log:
  - |-
    Mỗi client có hai pha: gửi lời chào (đọc tệp), rồi nhận dữ liệu và ghi vào tệp log. Cả hai đều là bài toán **tệp**, không chỉ socket.
  - |-
    Mỗi lần có client mới: `open(greeting, O_RDONLY)`, vòng `read` + `send` đến hết. Sau đó vòng `recv` và `write` vào tệp mở bằng `open(log, O_WRONLY | O_CREAT | O_APPEND, 0644)`.
  - |-
    Đọc lại tệp câu chào **mỗi lần** có client mới (đề nói nó có thể đổi). `write` đưa dữ liệu vào tệp ngay, nhưng nhớ `close` cả hai tệp khi xong một client để không rò rỉ fd. Dùng `O_APPEND` (không phải `O_TRUNC`), nếu không sẽ ghi đè dữ liệu client trước.

tcp-recv-line:
  - |-
    Bạn đang viết lại `fgets` cho socket. Vấn đề cốt lõi: một lần `recv` có thể trả về **nhiều dòng** hoặc **nửa dòng**. Phần dư sẽ đi đâu?
  - |-
    Cần một **bộ đệm lưu qua các lần gọi** (biến `static`, hoặc mảng theo `fd`). Mỗi lần gọi: nếu bộ đệm đã có dòng đầy đủ thì trả luôn, nếu chưa thì `recv` thêm vào bộ đệm.
  - |-
    Dùng `memchr` tìm `'\n'` (không dùng `strchr`: dữ liệu có thể chứa `0x00`). Khi trả một dòng, `memmove` phần còn lại lên đầu bộ đệm. Dừng khi gặp `'\n'`, hoặc đã lưu `cap-1` byte, hoặc `recv` trả `0`. Luôn kết thúc `buf` bằng `'\0'`.

tcp-stop-phrase:
  - |-
    Chuỗi cần tìm có thể bị cắt đôi giữa hai lần `recv` (`"Ky th"` + `"uat May tinh"`). Vậy chỉ tìm trong **từng mảnh** là không đủ.
  - |-
    Gom dữ liệu nhận được vào **một bộ đệm tích luỹ** từ đầu kết nối, rồi mới tìm chuỗi trong bộ đệm đó sau mỗi lần `recv`. Thêm `'\0'` trước khi dùng `strstr`.
  - |-
    Có hai kiểu làm đều đúng: (a) giữ **toàn bộ** dữ liệu (cấp phát đủ lớn, hoặc `realloc`), (b) chỉ giữ `strlen(phrase)-1` byte cuối của bộ đệm cũ. Bộ đệm không được tràn khi client gửi nhiều dữ liệu. Tìm thấy thì gửi `BYE\n`, `close`, `exit(0)`; client đóng mà chưa thấy thì thoát **không** gửi gì.

length-prefix:
  - |-
    Mỗi thông điệp có hai phần: 4 byte độ dài, rồi đúng L byte dữ liệu. Cả hai phần đều có thể đến **từng byte một**.
  - |-
    Lặp `recv` (cộng dồn số byte đã nhận) tới khi đủ 4 byte (`recv <= 0` thì dừng); `ntohl` được `L` (kiểu `unsigned int`); lại lặp `recv` tới khi đủ `L` byte. Trả lời bằng `htonl(L)` + dữ liệu đã đổi hoa. Xem thẻ **Thông điệp có độ dài tiền tố**.
  - |-
    Kiểm tra `L > 65536` **trước khi** cấp phát hoặc đọc dữ liệu; vượt thì `close` ngay, không trả lời, quay lại `accept`. `L = 0` hợp lệ (trả lại thông điệp rỗng). Chỉ đổi `a`–`z` thành hoa, các byte khác (kể cả `0x00`, `'\n'`) giữ nguyên.

sv-struct:
  - |-
    Bản ghi có độ dài **thay đổi** (do `name_len`), nên không thể đọc đúng `sizeof(struct)`. Bạn phải đọc **theo từng trường**, trường nào cần độ dài thì đọc độ dài trước.
  - |-
    Lặp `recv` tới khi đủ byte cho từng phần: 4 byte `mssv`, 1 byte `name_len`, `name_len` byte `name`, rồi 2+1+1+2 byte còn lại. Số nhiều byte đổi bằng `ntohl`/`ntohs`. Một client có thể gửi nhiều bản ghi liên tiếp: lặp đến khi `recv` trả `<= 0`.
  - |-
    Kiểm tra từng trường (ví dụ `month` 1…12, `gpa100` ≤ 400, `name_len` 1…100) rồi mới quyết định `OK` hay lỗi theo đề. Tên không có `'\0'` ở cuối: tự thêm vào bản sao trước khi in. Ghi log bằng `"a"` + `fclose`, thời gian lấy bằng đoạn code cho sẵn trong đề, gpa in `%.2f` từ `gpa100 / 100.0` (hoặc in nguyên/phần dư để tránh sai số).

udp-echo:
  - |-
    UDP không có kết nối, nên không có `listen`/`accept`. Mỗi lần nhận một datagram, bạn phải biết **ai gửi** để trả lời đúng người.
  - |-
    `socket(AF_INET, SOCK_DGRAM, 0)` → `bind` → vòng lặp: `recvfrom(..., &from, &fromlen)` rồi `sendto(..., &from, fromlen)`. Xem thẻ **UDP**.
  - |-
    Khởi tạo lại `fromlen = sizeof from` **trước mỗi** `recvfrom`. Bộ đệm ≥ 2048 byte. `recvfrom` trả `0` là datagram rỗng hợp lệ, vẫn phải gửi lại datagram rỗng (không coi là đóng kết nối). `n < 0` mới là lỗi.

udp-boundary:
  - |-
    Hai việc tách rời: (1) nhận được datagram **dài tối đa**, không bị cắt; (2) đếm thứ tự theo **người gửi**.
  - |-
    Bộ đệm `recvfrom` phải đủ 65507 byte (đặt 65536). Cần một bảng ánh xạ `(IP, cổng)` → bộ đếm; mảng các cấu trúc (địa chỉ, cổng, count) là đủ cho 100 người gửi, tìm tuyến tính.
  - |-
    So sánh người gửi bằng **cả** `sin_addr.s_addr` và `sin_port` (không so `memcmp` cả struct vì `sin_zero`). Trả lời bằng `snprintf("LEN %zd %d", n, count)`, trong đó `n` là giá trị `recvfrom` trả về (không dùng `strlen`: datagram có thể rỗng hoặc chứa `0x00`).

udp-calc:
  - |-
    Mỗi datagram là một yêu cầu hoàn chỉnh nên không cần ghép dòng. Phần việc là **phân tích cú pháp chặt** và một bộ đếm riêng cho từng người gửi.
  - |-
    Thêm `'\0'` vào cuối datagram rồi phân tích. Tự duyệt số: `-` tùy chọn rồi chữ số, cộng dồn và báo lỗi nếu sắp vượt `int64`; sau số thứ nhất phải là đúng một dấu cách, rồi toán tử một ký tự, rồi đúng một dấu cách, rồi số thứ hai và hết xâu. Bảng `(địa chỉ, cổng) → count` giống bài `udp-boundary`.
  - |-
    `COUNT` chỉ đếm phép tính **thành công** (không đếm `ERROR`). Chia/lấy dư cho 0 thì trả `ERROR div0` (đừng thực hiện phép chia, sẽ crash). Cẩn thận `INT64_MIN / -1` tràn số. `5+3` hay thừa/thiếu dấu cách đều là `ERROR syntax`.

looping-server:
  - |-
    Server lặp: `accept` → đọc **một** yêu cầu → trả lời → `close` → quay lại. Phần chính là hiểu và kiểm tra dòng yêu cầu HTTP.
  - |-
    Đọc vào bộ đệm đến khi gặp `\r\n\r\n` (có thể nhiều mảnh, tối đa 8 KB). Tách dòng đầu bằng `sscanf("%s %s %s")` ra METHOD, PATH, VERSION. Xem thẻ **Server lặp & thiết kế giao thức**.
  - |-
    Thứ tự kiểm tra: dòng đầu đủ 3 phần (400) → METHOD là `GET` (405) → PATH không chứa `..` (403) → tệp tồn tại và là tệp thường (404, dùng `stat` + `S_ISREG`). Bỏ phần sau `?` **trước** các kiểm tra; PATH kết thúc `/` thì thêm `index.html`. `Content-Length` phải đúng số byte thân, header phân cách bằng `\r\n`.

nonblock-accept:
  - |-
    Không có `select`, không có luồng: bạn phải liên tục tự hỏi từng socket "có việc chưa?" mà không bị chặn.
  - |-
    Đặt cả socket nghe và từng socket client sang non-blocking bằng `ioctl(fd, FIONBIO, &io_mode)` như `non_blocking_server.c`. Mỗi vòng: thử `accept`, rồi duyệt mảng client thử `recv`. Xem thẻ **Socket non-blocking**.
  - |-
    `recv` trả `-1` là "chưa có dữ liệu", **không phải lỗi** → bỏ qua, thử client tiếp theo; `0` là client đóng → `close` và xoá khỏi mảng. `accept` cũng trả `-1` khi chưa có ai kết nối.

select-two-ports:
  - |-
    Một luồng, hai socket nghe: `accept` thẳng ở một cổng sẽ chặn và bỏ đói cổng kia. `select` cho bạn biết cổng nào **đang có người chờ**.
  - |-
    Mỗi vòng: `FD_ZERO(&read_fds); FD_SET(listener1, &read_fds); FD_SET(listener2, &read_fds);`, `max_fd` là fd lớn hơn trong hai fd, `select(max_fd + 1, &read_fds, NULL, NULL, NULL)`. Sau đó hai lệnh `if (FD_ISSET(...))` riêng, mỗi lệnh `accept` + `send` + `close(client)`.
  - |-
    Không dựng `fd_set` một lần trước vòng lặp: `select` xoá khỏi tập những fd chưa sẵn sàng. Tham số đầu là `max_fd + 1`, không phải 2. Hàm `make_listener(port)` dùng cho cả hai cổng (`port` và `port + 1`). Xem thẻ **Ghép kênh I/O với select**.

select-online-count:
  - |-
    Bài này là phần "danh sách client" của `select_server.c`: client vào thì thêm vào mảng, client đóng thì xoá khỏi mảng. Con số cần gửi chính là kích thước mảng.
  - |-
    Khi `FD_ISSET(listener)`: `accept`, `client_list[number_of_clients++] = fd`, rồi `sprintf(message, "ONLINE %d\n", number_of_clients)` và `send`. Mỗi vòng dựng lại `fd_set` gồm listener và mọi client trong mảng; client nào sẵn sàng thì `recv` vào bộ đệm và bỏ dữ liệu.
  - |-
    `recv` trả `0` (client đóng) hoặc `-1` (lỗi): `close(fd)` **và** xoá khỏi mảng (đưa phần tử cuối vào chỗ trống, `number_of_clients--`, `i--`). Quên xoá thì `n` không bao giờ giảm; quên `close` thì hết 256 fd. Phải `recv` cả khi client chỉ gửi rác, nếu không không bao giờ thấy nó đóng.

select-echo:
  - |-
    Khi `select` trả về, hệ điều hành đã nói cho bạn biết fd nào **chắc chắn không chặn**. Việc của bạn là quản lý danh sách fd và dựng lại tập mỗi vòng.
  - |-
    Như `select_server.c`: giữ mảng `client_list[]`. Mỗi vòng: `FD_ZERO`, `FD_SET` socket nghe và mọi client, tính `max_fd`; `select(max_fd + 1, &read_fds, NULL, NULL, NULL)`; nếu `FD_ISSET(listener)` thì `accept` và thêm vào mảng; client có dữ liệu thì `recv` rồi `send` lại.
  - |-
    `select` **ghi đè** tập truyền vào → dựng lại mỗi vòng. Tham số đầu là `max_fd + 1`. Khi `recv <= 0`: `close(fd)` **và** xoá fd khỏi `client_list` (code mẫu quên bước này).

chat-select:
  - |-
    Mỗi client có **trạng thái riêng**: chưa đăng ký hay đã đăng ký (kèm `id`), và một bộ đệm riêng để ghép dòng (client có thể gửi nửa dòng).
  - |-
    Khai báo `struct Client { int fd; char buf[...]; size_t len; int registered; char id[...]; }` và mảng các client. Khi một fd có dữ liệu: `recv` thêm vào `buf` của chính nó, rồi lặp cắt từng dòng (`memchr '\n'`). Chưa đăng ký thì phân tích `id: name`; đã đăng ký thì broadcast. Xem thẻ **Quản lý nhiều client**.
  - |-
    Đăng ký hợp lệ khi có đúng `": "`, cả id và name **khác rỗng và không chứa dấu cách**. Broadcast `"<id>: <dòng>\n"` tới các client **đã đăng ký** trừ người gửi. Bỏ `\r` cuối dòng. Client đóng đột ngột: `close`, `FD_CLR`, đánh dấu ô trống, không gửi cho fd đã đóng.

fork-echo:
  - |-
    Cha chỉ làm một việc: `accept`. Mỗi client được giao cho một tiến trình con. Hai việc dễ quên là dọn zombie và đóng fd.
  - |-
    Sau `accept`: `fork()`. Trong con (`pid == 0`): `close(listen_fd)`, phục vụ echo, `close(client)`, `exit(0)`. Trong cha: `close(client)` rồi quay lại `accept`. Xem thẻ **Server đa tiến trình**.
  - |-
    Dọn zombie bằng handler `SIGCHLD` chứa `while (waitpid(-1, NULL, WNOHANG) > 0);`. `accept` trả `-1` thì `continue`, đừng thoát. Con quên `exit(0)` sẽ rơi xuống vòng `accept` của cha.

telnet-fork:
  - |-
    Giao thức giống `telnet-select`, nhưng mỗi client có tiến trình riêng nên trạng thái đăng nhập chỉ là biến cục bộ của con. Điểm mới là một lệnh chậm không chặn client khác.
  - |-
    Cha `accept` + `fork` giống `fork-echo`. Trong con: vòng đọc dòng (ghép dòng như bài `tcp-recv-line`), kiểm tra đăng nhập bằng `accounts.txt`, chạy lệnh bằng `popen(cmd "2>&1", "r")` hoặc `system` ghi vào tệp tạm rồi đọc lại. Xem thẻ **Telnet server**.
  - |-
    Như `forking_server.c` + `telnet_server.c`: cha `accept` rồi `fork`; con đóng socket nghe, phục vụ cả phiên rồi `exit(0)`; cha `close(client)` và quay lại `accept` ngay (đừng `wait` ở đây). Phản hồi phải là `OUTPUT <n>\n` rồi đúng `n` byte; nhớ gộp stderr vào stdout.

telnet-select:
  - |-
    Mỗi client có một **máy trạng thái** nhỏ: chưa đăng nhập → đã đăng nhập. Mọi thứ khác là ghép dòng và chạy lệnh.
  - |-
    Dùng cấu trúc client giống `chat-select` (bộ đệm dòng + cờ `logged_in`). Đăng nhập: đọc `accounts.txt` mỗi lần, so `user pass`. Lệnh: `popen(cmd, "r")` (gộp stderr bằng `2>&1`), `fread` hết, gửi `OUTPUT <n>\n` rồi `n` byte. `exit` → `BYE` và đóng.
  - |-
    Cắt `\r` cuối dòng trước khi so sánh. Dòng nào gửi trước khi đăng nhập thành công cũng bị coi là một lần đăng nhập. `n` là số byte **thật** của kết quả (dùng số `fread` trả về, kết quả có thể rỗng hoặc chứa `0x00`). Nhớ `pclose` để không rò rỉ tiến trình con.

thread-args:
  - |-
    Mỗi số một luồng; việc khó không phải là phép nhân mà là **làm sao luồng biết nó phải tính số nào**. Hàm luồng chỉ nhận một `void *`.
  - |-
    Trong vòng tạo luồng: `int *p = malloc(sizeof *p); *p = i; pthread_create(&tid[i], NULL, worker, p);`. Trong `worker`: `int i = *(int *)arg; free(arg);`. Sau đó một vòng khác `pthread_join(tid[i], NULL)` rồi mới in.
  - |-
    Đừng truyền `&i`: vòng `for` tăng `i` trước khi luồng mới chạy, nên nhiều luồng cùng đọc một giá trị `i` và các ô còn lại không ai tính. Đừng `join` ngay trong vòng tạo (các luồng chạy lần lượt). Dùng `long long` cho cả mảng và `printf("%lld\n", ...)` vì bình phương tới `10^18`.

thread-slow-hello:
  - |-
    Giống `tcp-hello-loop` nhưng mỗi client có một luồng riêng. `sleep(1)` làm cho cả hai lỗi kinh điển (phục vụ lần lượt, truyền `&client`) lộ ra ngay.
  - |-
    Vòng `accept`: `int *p = malloc(sizeof *p); *p = client; pthread_create(&t, NULL, greet, p); pthread_detach(t);`. Hàm luồng: lấy `fd`, `free(p)`, `sleep(1)`, `send(fd, "Hello!\n", 7, 0)`, `close(fd)`. Xem thẻ **Server đa luồng**.
  - |-
    Mọi thứ liên quan tới client (kể cả `sleep`) nằm **trong hàm luồng**, luồng chính chỉ `accept` rồi tạo luồng. Gửi đúng 7 byte (không `sizeof("Hello!\n")`, nó là 8). Luồng tự `close(fd)`; không `pthread_join`.

thread-echo:
  - |-
    Mỗi client một luồng; các luồng dùng chung bộ nhớ, nên điều nguy hiểm không phải echo mà là **cách bạn đưa `fd` cho luồng**.
  - |-
    Hàm luồng nhận `void *`. Cấp phát `int *p = malloc(sizeof *p); *p = client;`, truyền `p` cho `pthread_create`; trong luồng lấy giá trị ra rồi `free(p)`. Gọi `pthread_detach(tid)`. Biên dịch có `-pthread`. Xem thẻ **Server đa luồng**.
  - |-
    Truyền `&client` của biến cục bộ là lỗi kinh điển: vòng sau ghi đè trước khi luồng đọc. Luồng phải tự `close(fd)` khi `recv == 0`. Nếu `pthread_create` thất bại thì `close` và `free` tại chỗ.

thread-chat:
  - |-
    Giao thức giống `chat-select`, nhưng danh sách client giờ là **dữ liệu dùng chung** của mọi luồng: ai đụng vào cũng phải qua khoá.
  - |-
    Một mảng/danh sách client toàn cục kèm `pthread_mutex_t`. Luồng của mỗi client có ghép dòng riêng (biến cục bộ), phần đăng ký thêm vào danh sách dưới khoá, broadcast thì khoá, duyệt, gửi, mở khoá.
  - |-
    Khi client thoát phải **gỡ khỏi danh sách dưới khoá** trước khi `close(fd)`, nếu không luồng khác có thể `send` vào fd đã đóng (hoặc đã được cấp lại cho client mới). Mọi nhánh `return`/`break` phải mở khoá (tránh deadlock). Không giữ khoá khi `recv`. Không gửi cho chính người gửi và cho client chưa đăng ký.

kv-max-n:
  - |-
    Có hai yêu cầu độc lập: (1) phục vụ đồng thời nhiều client **dùng chung một bảng key-value**, (2) từ chối client thứ N+1. Đề nói rõ `fork` không phù hợp, hãy nghĩ vì sao.
  - |-
    Chọn `select` (một luồng, không cần khoá) cho gọn. Bảng key-value là mảng `{key, value, used}` tối đa 1000 phần tử. Mỗi client có bộ đệm dòng riêng. Khi `accept`: nếu `nclients >= N` thì gửi `FULL\n` rồi `close`, ngược lại gửi `WELCOME\n` và tăng `nclients`. Xem thẻ **Quản lý nhiều client**.
  - |-
    Giảm `nclients` ở **mọi** đường client rời đi (`QUIT`, `recv == 0`, lỗi). Lệnh sai tên hoặc **thừa/thiếu tham số** đều trả `ERROR` (kiểm tra bằng số trường `sscanf` đọc được cộng với việc không còn ký tự thừa). `SET` ghi đè nếu key đã có; bảng đầy 1000 key thì quyết định xử lý theo đề. `QUIT` trả `BYE` rồi đóng. Bỏ `\r` cuối dòng.

echo-max-n:
  - |-
    Hai việc: (1) phục vụ nhiều client cùng lúc (giống *select-echo*), (2) đếm số client **đang kết nối** để từ chối client thứ N+1. Thử trả lời: biến đếm tăng ở đâu, giảm ở đâu?
  - |-
    Dùng `select` như `select_server.c`. Khi `accept`: nếu `active >= N` thì gửi `FULL\n` rồi `close` (client này **không** tính vào `active`), ngược lại `active++` và gửi `WELCOME\n`. `COUNT` trả đúng giá trị `active` hiện tại.
  - |-
    `active--` chỉ nên đặt ở **một** chỗ: đường đóng client chung, dùng cho cả `QUIT`, `recv == 0` và lỗi. Mỗi client có bộ đệm dòng riêng vì dòng có thể đến cắt vụn hoặc dính nhau. Bỏ `\r` cuối dòng; dòng rỗng vẫn trả `ECHO ` (có dấu cách).

chat-client:
  - |-
    Có hai nguồn sự kiện cần chờ **cùng lúc**: bàn phím và socket. Nếu chờ lần lượt (`fgets` rồi `recv`), phía nào im lặng sẽ làm phía kia đơ. Cái bạn cần là một hàm chờ được nhiều fd.
  - |-
    Như `select_client.c`: mỗi vòng `FD_ZERO`, `FD_SET(STDIN_FILENO)` và `FD_SET(sock)`, `select(max_fd + 1, &read_fds, NULL, NULL, NULL)`. Nhánh socket: `recv` rồi `fwrite` ra stdout + `fflush`. Nhánh stdin: `read(STDIN_FILENO, ...)` rồi `send` sang server.
  - |-
    `read` trả `0` (EOF) hoặc `recv` trả `<= 0` (server đóng): `close` socket và thoát mã `0`. Xét socket trước stdin để không gửi vào kết nối đã đóng. Tin dở dòng (chưa có `\n`) phải `fflush(stdout)` ngay.

sv-client:
  - |-
    Bài toán là **tuần tự hoá**: biến 4 giá trị đọc từ bàn phím thành một dãy byte đúng đặc tả. Hãy vẽ ra bản ghi trên giấy: byte thứ mấy là gì, dài bao nhiêu?
  - |-
    Dùng mảng `unsigned char rec[...]` và `memcpy` từng trường sau khi đổi: `htonl(mssv)` (4 byte), `nlen` (1 byte, là `strlen(name)` tính bằng **byte**), tên, `htons(year)`, `month`, `day`, `htons(gpa100)`. Gửi cả mảng bằng một `send`. Ngày sinh tách bằng `sscanf(dob, "%u-%u-%u", ...)`.
  - |-
    `fgets` giữ `\n`: bỏ nó (`strcspn`) trước khi `strlen`. Đọc điểm bằng `sscanf(s, "%lf", &g)` rồi `(unsigned short)(g * 100 + 0.5)`, không ép thẳng (vì `2.85*100 = 284.999…`). Dòng phản hồi: `recv` từng byte tới `\n`; `ERROR` thì dừng.

udp-client:
  - |-
    UDP không có kết nối và không đảm bảo giao hàng. Hãy nghĩ: nếu server không trả lời thì sao, và chương trình của bạn đợi tới bao giờ?
  - |-
    Mỗi dòng: bỏ `\r\n` cuối, bỏ qua dòng rỗng, `sendto` đúng `strlen` byte. Rồi `select` trên socket với `timeout.tv_sec = 1` (gán lại mỗi lần, xem `select_client.c`): lớn hơn `0` thì `recvfrom`, ngược lại in `TIMEOUT`. Đây là `udp_sender.c` cộng thêm nhận phản hồi.
  - |-
    Phản hồi không có `\0` và không có `\n`: in bằng `fwrite(buf, 1, k, stdout)` rồi `printf("\n")`. Bộ đệm nhận cần ít nhất 2048 byte.

fly-parse:
  - |-
    Mỗi dòng cần hai quyết định tách biệt: **tên lệnh có hợp lệ không** (`999`) và **tham số có đúng không** (`201`). Hãy tách dòng thành các thành phần trước, rồi mới kiểm tra từng cái.
  - |-
    Đừng dùng `strtok`: nó gộp nhiều dấu cách thành một nên không thấy được thành phần rỗng (dấu cách thừa). Tách thủ công bằng `strchr(p, ' ')`: gặp dấu cách thì ghi `'\0'` và nhảy sang ký tự kế. Số thành phần là số lần tách + 1.
  - |-
    Viết các hàm nhỏ: `valid_user`, `valid_pass`, `airport`, `valid_date`. Ngày thật: `1900 ≤ năm ≤ 2100`, tháng 1–12, ngày ≥ 1 và ≤ số ngày của tháng; năm nhuận là `(y%4==0 && y%100!=0) || y%400==0`. Ngày về hợp lệ khi `strcmp(ngay_ve, ngay_di) >= 0`. Bỏ `\n` rồi **đúng một** `\r`; dòng trống thì `continue`. Dòng dài nhiều thành phần: đừng ghi vượt mảng con trỏ.

flight-filter:
  - |-
    Đây là hai việc nối nhau: **nạp** tệp một lần vào mảng, rồi với mỗi truy vấn **duyệt** mảng theo đúng thứ tự trong tệp.
  - |-
    `fgets` + `sscanf` với mẫu 11 trường (`%15s ... %lld %d %lld %d`); mảng `struct` tĩnh 1000 phần tử. Điều kiện chuyến thỏa: cùng `from`, `to`, `date` (so bằng `strcmp`) và số ghế của **hạng được chọn** `>= số khách`. Chọn giá/ghế theo `strcmp(hang, "BUS")`.
  - |-
    Tổng tiền dùng `long long` (giá × số khách tới 9×10^8, gần ngưỡng của `int`). Phải in `110 FLIGHTS k` **trước** k dòng nên cần đếm hoặc lưu chỉ số các chuyến khớp trước khi in. Đọc lại tệp cho mỗi truy vấn sẽ quá chậm với hàng chục nghìn truy vấn.

fly-search:
  - |-
    Bài này là ghép hai bài đã làm: **kiểm tra cú pháp** (fly-parse) + **lọc chuyến** (flight-filter), đặt trong một server nhiều client như `kv-max-n`. Hãy tách riêng ba tầng: ghép dòng, phân tích lệnh, trả lời.
  - |-
    Mỗi client có bộ đệm dòng riêng (`select`). Với khứ hồi, chiều về là cùng hàm lọc nhưng đổi chỗ `đi`/`đến` và dùng ngày về. Ghi cả phản hồi vào **một** bộ đệm rồi `send` một lần để các dòng của hai chiều không xen lẫn.
  - |-
    `QUIT` kèm tham số là `201`; dòng trống là `999`; kiểm tra `QUIT`/`SEARCH` bằng `strcmp` đầy đủ (không so tiền tố). Bộ đệm phản hồi cần đủ lớn cho cả chiều đi và chiều về (mỗi dòng chuyến bay khoảng 40 byte).

fly-auth:
  - |-
    Tách bài thành ba phần độc lập: **giới hạn N client** (như `kv-max-n`), **trạng thái phiên** (mỗi client nhớ tài khoản đang đăng nhập hay chưa), **bảng tài khoản** (nạp từ tệp, ghi nối khi đăng ký).
  - |-
    Trong `struct` của mỗi client thêm `int acct` (-1 nếu chưa đăng nhập). Một tài khoản đang dùng khi **có client nào đó đang kết nối** có `acct` bằng nó, nên khi client rời đi phải đặt lại `acct = -1` (và khi nhận kết nối mới vào ô cũ cũng đặt `-1`). `REGISTER`: `fopen("accounts.txt", "a")`, `fprintf`, `fclose` ngay.
  - |-
    Thứ tự kiểm tra của `LOGIN`: cú pháp (`201`) → phiên đã đăng nhập (`207`) → tên/mật khẩu (`203`) → tài khoản đang bị phiên khác dùng (`207`). Lệnh bị từ chối không được ghi gì vào tệp. `LOGOUT`/`WHOAMI`/`QUIT` kèm tham số là `201`.

fly-status-udp:
  - |-
    UDP **giữ ranh giới thông điệp**: mỗi `recvfrom` nhận trọn một lệnh, nên không cần ghép dòng. Việc cần làm là kiểm tra độ dài, tách thành phần và trả lời đúng địa chỉ người gửi.
  - |-
    Dùng một socket `SOCK_DGRAM`, `bind`, rồi vòng lặp `recvfrom(...)` → xử lý → `sendto(..., &from, fromlen)` về đúng `from`. Bộ đệm nhận lớn hơn 1000 byte để phân biệt datagram dài. Trạng thái `(chuyến, ngày)` lưu trong mảng struct.
  - |-
    Thứ tự của `SET`: **cú pháp (ERROR) → khóa (DENIED) → tồn tại (NOT_FOUND)**. `DELAYED <phút>`: phút gồm 1–4 chữ số, không bắt đầu bằng `0`, giá trị 1–1440. Bỏ một `\n` rồi một `\r` cuối datagram (chỉ một cặp). Datagram rỗng vẫn phải trả `ERROR`.

fly-book:
  - |-
    Hãy mô hình hóa trước khi code: **chuyến** (ghế còn lại mỗi hạng), **tài khoản** (số dư), **bản ghi đặt chỗ** (PNR, chủ, số tiền, hạn, trạng thái `HOLD/PAID/EXPIRED/GONE`) và **phiên** (client nào đã tạo bản ghi). Mọi lệnh chỉ là biến đổi các bảng này.
  - |-
    Dữ liệu dùng chung nên chọn `select` một luồng cho đơn giản (không cần mutex), hoặc đa luồng với **một mutex** bọc toàn bộ xử lý một lệnh. Hết hạn xét "lười": ở đầu **mỗi** lệnh gọi `expire_holds()` quét các bản ghi `HOLD` có `expire <= time(NULL)`, đổi sang `EXPIRED` và trả ghế. Muốn dọn cả khi không ai gửi lệnh thì đặt timeout cho `select`.
  - |-
    PNR: sinh 6 ký tự bằng `rand()` (nhớ `srand(time(NULL))`), kiểm tra không trùng với **mọi** PNR từng cấp. "Hạn" in bằng `localtime` + `printf("%02d:%02d:%02d")`. Thẻ: Luhn từ phải sang trái; hạn `MM/YY` so với `localtime` (tháng hiện tại vẫn hợp lệ). Thứ tự kiểm tra của `PAY`: đăng nhập → cú pháp → tồn tại → của đúng tài khoản → đã trả → hết hạn → thanh toán. Khi client rời đi, trả ghế của các bản ghi `HOLD` do **phiên** đó tạo (vé đã trả giữ nguyên). Nên `signal(SIGPIPE, SIG_IGN)`.

fly-log:
  - |-
    Có ba việc: (1) biết **địa chỉ của client**, (2) ghi **một dòng log mỗi sự kiện**, (3) đúng **thứ tự và thời điểm** (log trước khi gửi, flush ngay).
  - |-
    `accept(ls, (struct sockaddr *)&ca, &len)` cho địa chỉ client; `inet_ntoa(ca.sin_addr)` và `ntohs(ca.sin_port)` (như `udp_receiver.c`) ghép thành `"ip:cổng"`, lưu trong struct của client. Mở tệp log bằng `fopen(path, "a")` **một lần** ở đầu `main`; một hàm `log_event(addr, kind, text)` dùng `time` + `localtime` + `strftime` rồi `fprintf` + `fflush`.
  - |-
    Hàm `reply` phải gọi `log_event(..., "SEND", ...)` **trước** `send`. `RECV` ghi theo từng dòng đủ `\n` (sau khi bỏ `\r`), không theo lần `recv`. `DISCONNECT` ghi ở một chỗ duy nhất (hàm đóng client) nên đủ cho cả `QUIT`, đóng và RST. Phần dở dang khi client rời đi thì bỏ, không ghi.

chat-proto:
  - |-
    Đây là `chat-select` cộng hai việc: **tên (nick)** của từng client và **tìm đúng một client theo tên** để gửi riêng. Mọi thứ khác (ghép dòng, phát tin) đã có.
  - |-
    Tách lệnh ở **dấu cách đầu tiên**: `strchr(line, ' ')`, đặt `'\0'` tại đó; phần sau là tham số nguyên văn. `PMSG` tách tiếp ở dấu cách thứ hai. Hàm `find_nick(nick)` duyệt mảng client giống `get_nickname` trong `pthread_chatroom.c`, bỏ qua ô trống (`fd < 0`) và client chưa JOIN.
  - |-
    Thứ tự kiểm tra: `JOIN` đã vào rồi (`203`) → quy cách tên (`201`) → trùng (`200`). `MSG`/`PMSG`: cú pháp (`999`) → đã JOIN (`203`) → người nhận (`202`; gửi cho chính mình cũng là `202`). Khi client rời đi nhớ đánh dấu ô trống **và** xóa cờ đã JOIN để giải phóng tên. Nếu dùng luồng: bọc mọi lần duyệt danh sách bằng mutex, và truyền cho luồng một con trỏ cấp phát riêng.

fly-compare:
  - |-
    Hai bước: **lọc** (như flight-filter) rồi **sắp xếp** với tiêu chí chọn lúc chạy. Hãy tạo một mảng "dòng kết quả" gồm con trỏ tới chuyến, số phút bay và tổng tiền để sắp xếp.
  - |-
    `qsort(rows, k, sizeof rows[0], cmp)` với ba hàm `cmp` (lab05, con trỏ hàm); chọn hàm bằng `strcmp(tieu_chi, ...)`. Số phút bay: `đến − đi`, nếu `≤ 0` thì `+ 1440`. So **số** bằng số (không `strcmp` trên chuỗi giá), tổng tiền dùng `long long`.
  - |-
    `qsort` không ổn định nên mọi trường hợp hòa phải có khóa phụ cuối cùng là `strcmp(mã chuyến)`. `BEST`: sắp theo (hãng, mã) rồi duyệt từng nhóm cùng hãng, giữ chuyến rẻ nhất / nhanh nhất bằng so sánh **chặt** (`<`) để khi hòa lấy mã nhỏ hơn (vì nhóm đã theo mã tăng dần).

fly-print-client:
  - |-
    Hội thoại lock-step: chờ dòng của server rồi mới gửi lệnh kế. Bài khó ở phần cuối: **sau dòng `120 FILE n` là `n` byte nhị phân**, và lần `recv` đọc dòng đó có thể đã kéo theo một phần (hoặc cả) nội dung.
  - |-
    Viết `read_line()` dùng bộ đệm `static` có `rlen`/`rpos` giữ giữa các lần gọi (đọc một ký tự từ bộ đệm, bộ đệm cạn thì `recv`). Sau khi parse `n`, **ghi trước phần còn trong bộ đệm** (`rb + rpos`), rồi `recv` tiếp cho đủ `n`. Ghi bằng `fwrite` (không `fputs`/`strlen`, vì có byte `0x00`).
  - |-
    Không cấp phát `n` byte: đọc từng khối 64 KB và ghi thẳng. Ghi vào `<tệp>.tmp` rồi `rename` khi nhận đủ, như vậy lỗi giữa chừng không để lại tệp dở và không xóa tệp cũ. Kiểm tra `n` bằng cách duyệt từng ký tự chữ số (không `atoi`), tối đa 7 chữ số và ≤ 5 000 000. Lỗi: in `ERROR <dòng>`, gửi `QUIT`, thoát mã 1.

fly-eticket:
  - |-
    Server làm **hai vai**: server với client của bạn, và **client** của máy chủ SMTP. Viết riêng một hàm `smtp_send(email, message)` trả 1/0, rồi `ISSUE` chỉ là: sinh số vé → ghi `tickets.txt` → gọi `smtp_send` → lưu `.eml` → đẩy tin → trả lời.
  - |-
    Mỗi lệnh SMTP kết thúc `\r\n`; sau mỗi lệnh đọc phản hồi **nhiều dòng**: các dòng `250-...` rồi dòng `250 ...` (ký tự thứ 4 là dấu cách). Chờ có giới hạn thời gian: trước mỗi `recv` gọi `select` với `struct timeval tv = {2, 0}` trên socket SMTP; hết giờ hoặc mã sai thì gửi `QUIT`, đóng, báo `MAIL_FAILED`. Thư kết thúc bằng một dòng chỉ có dấu chấm.
  - |-
    Số vé: `sprintf(ticket, "%s%010ld", mã_hãng, serial)`; `serial` khởi tạo bằng số dòng của `tickets.txt` + 1 và tăng sau mỗi vé. `mkdir("outbox", 0777)` rồi `mkdir("outbox/<user>", 0777)` (không sao nếu đã có). Đẩy `300 TICKET ...` cho **các phiên khác** cùng tài khoản trước khi trả lời phiên đang `ISSUE`. Nên `signal(SIGPIPE, SIG_IGN)`: cả client đã đóng lẫn máy chủ SMTP đóng giữa chừng đều có thể làm `send` gây `SIGPIPE`.

fly-manage:
  - |-
    Mọi phép tính thời gian quy về **một số nguyên: số phút kể từ một mốc**. Khi đã có `phút_khởi_hành − phút_hiện_tại`, các luật 72 giờ, 24 giờ, 3 giờ chỉ còn là so sánh số nguyên.
  - |-
    Đổi `"YYYY-MM-DD"` + `"HH:MM"` ra phút bằng `sscanf` rồi `mktime` (đặt `tm_isdst = -1`), hoặc tự tính ngày từ năm/tháng/ngày (cẩn thận năm nhuận, tháng 1–2). Hoàn tiền: `giá * pct / 100` với số nguyên (chia nguyên làm tròn xuống). `CHANGE`: kiểm tra **đúng thứ tự** trong đề trước khi thay đổi bất cứ thứ gì (ghế, ví, vé), để lỗi giữa chừng không để lại trạng thái dở.
  - |-
    `PRINT`: dựng nội dung trong một bộ đệm bằng `snprintf` và lấy **giá trị trả về** làm `n`; gửi `120 FILE n\n` rồi đúng `n` byte (không dùng `strlen` nếu nội dung có thể chứa `0x00`). Biên: `≥` hay `>` ở mốc đúng 72 giờ / 24 giờ / 3 giờ, và `left <= 0` là đã khởi hành.

fly-notify:
  - |-
    Có hai khái niệm tách biệt: **phiên** (một kết nối) và **tài khoản** (có thể nhiều phiên). Thông báo gắn với tài khoản: gửi cho mọi phiên đang online của nó, và nếu không có phiên nào thì xếp vào **hàng đợi của tài khoản**.
  - |-
    Mỗi tài khoản có một hàng đợi (mảng `char (*q)[128]` + `nq` + `cap`, `realloc` khi đầy). Khi `LOGIN` thành công: trả `100 OK <user>` **trước**, rồi nếu đây là phiên online đầu tiên của tài khoản thì gửi toàn bộ hàng đợi và đặt `nq = 0`. Sự kiện: duyệt các tài khoản có vé `PAID` trên chuyến (mỗi tài khoản **một lần**, dù có nhiều vé).
  - |-
    Quyền admin lưu trong struct client và **xóa khi client rời đi và khi ô được dùng lại**. Kiểm tra theo thứ tự: admin (`203`) → cú pháp/định dạng (`201`) → chuyến có không (`202`) → đã hủy (`209`). Gửi thông báo cho khách trước khi trả `100 OK <k>` cho admin. `signal(SIGPIPE, SIG_IGN)`: sự kiện có thể đẩy vào phiên vừa đóng.

fly-client:
  - |-
    Vòng lặp chính đừng gọi hàm đọc bàn phím trần: viết hai hàm **`user_line()`** (chờ người dùng, vừa chờ vừa in thông báo) và **`response_line()`** (chờ phản hồi, bỏ qua và in thông báo). Mọi chỗ cần dữ liệu đều đi qua hai hàm này.
  - |-
    `select` trên `{STDIN_FILENO, sock}`. Đọc stdin bằng `read(0, ...)` vào bộ đệm riêng rồi tự tách dòng; **không** trộn `fgets`/`scanf` với `select` (dữ liệu nằm trong bộ đệm của `FILE` nên `select` không báo, client treo). Bộ đệm socket cũng tách dòng riêng: một lần `recv` có thể chứa nhiều dòng hoặc nửa dòng.
  - |-
    Dòng `301 NOTIFY x` bất kỳ lúc nào thì in `[THONG BAO] x`, kể cả giữa các dòng của phản hồi nhiều dòng. Với `BOOK` thành công cần `sscanf` lấy PNR rồi hỏi thanh toán; mọi lệnh gửi nguyên văn giá trị người dùng gõ. EOF của stdin → `QUIT` rồi `exit(0)`; `recv` trả `<= 0` → in `Mat ket noi`, thoát mã 1.

fly-web:
  - |-
    Làm theo đúng khung `http_server.c` (đọc đến `\r\n\r\n` → `sscanf` method/path → định tuyến → gửi header + thân → `close`), rồi thêm: kiểm tra chặt dòng đầu, giải mã query, `POST` đọc đủ `Content-Length`, và trang HTML dựng bằng bộ đệm lớn.
  - |-
    Thứ tự kiểm tra: dòng đầu đủ 3 phần đúng một dấu cách và phiên bản `HTTP/1.0|1.1` (`400`) → method `GET|POST` (`405`) → đường dẫn (`404`) → với POST: `Content-Length` hợp lệ `0..4096` (`400`) → tham số (`400`). Tách query ở `&` rồi `=`, **sau đó** mới giải mã từng giá trị (`%XX` hex hoa/thường; `+` thành dấu cách; `%` hỏng là lỗi). Khóa lặp lấy lần đầu.
  - |-
    `Content-Length` đúng bằng độ dài thân: đếm bằng giá trị trả về của `snprintf`. Mỗi kết nối một luồng với tham số `malloc` riêng và `pthread_detach`; `signal(SIGPIPE, SIG_IGN)` vì client có thể đóng trước khi nhận hết. Nhớ `<strings.h>` cho `strncasecmp` khi so tên header không phân biệt hoa thường.
