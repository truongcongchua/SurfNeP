- id: tcp-recv-line-one-recv
  problem: tcp-recv-line
  file: one_recv.c
  concept: tcp-stream
  lines: [7, 10, 11]
  near: [8, 9]
  verdict: WA
  symptom: "Khi bên kia gửi `a\\nb\\n` trong một lần, dòng `b` biến mất; khi gửi `ab` rồi `c\\n`, dòng bị cắt thành hai."
  title: Một lần recv rồi cắt ở '\n'
  explain: |-
    Hàm chỉ gọi `recv` một lần và **vứt** phần dữ liệu sau `'\n'` (dòng 10–11 chỉ đặt lại độ dài). Lần gọi sau không thể trả lại phần đó.
    Ngược lại nếu dòng đến thành nhiều mảnh thì `recv` đầu tiên chưa có `'\n'` và hàm trả về nửa dòng.
    Cần bộ đệm lưu **giữa các lần gọi** và vòng lặp `recv` đến khi gặp `'\n'`.
  fix: "Giữ bộ đệm `static` (hoặc theo fd), `memchr` tìm `'\\n'`, `memmove` phần dư, `recv` thêm nếu chưa có dòng đầy đủ."

- id: tcp-stop-phrase-per-chunk
  problem: tcp-stop-phrase
  file: per_chunk_strstr.c
  concept: tcp-stream
  lines: [22, 23, 24]
  verdict: WA
  symptom: "Khi client gửi `Ky th` rồi `uat May tinh`, server không bao giờ gửi `BYE`."
  title: strstr chỉ trên từng mảnh vừa nhận
  explain: |-
    Mỗi vòng lặp ghi đè `buf` bằng mảnh mới (`recv(client, buf, ...)`) và chỉ tìm chuỗi trong mảnh đó. Nếu chuỗi bị cắt đôi giữa hai lần `recv`, không mảnh nào chứa trọn vẹn nó.
    Phải tìm trong **bộ đệm tích luỹ** từ đầu kết nối (hoặc giữ lại phần đuôi dài `strlen(phrase)-1` byte của lần trước).
  fix: "`recv(client, buf + len, sizeof buf - 1 - len, 0)`, cộng dồn `len`, rồi `strstr` trên toàn bộ `buf`."

- id: length-prefix-single-recv
  problem: length-prefix
  file: single_recv.c
  concept: tcp-stream
  lines: [23, 28, 30]
  near: [24, 25, 26]
  verdict: WA
  symptom: "Khi 4 byte độ dài hoặc phần dữ liệu đến từng mảnh, server trả về dữ liệu rác hoặc thiếu."
  title: Giả định một recv nhận trọn một thông điệp
  explain: |-
    Điều kiện `recv(...) >= 4` coi như một lần nhận luôn có đủ độ dài **và** toàn bộ L byte dữ liệu. TCP không đảm bảo điều đó: 4 byte đầu có thể đến từng byte, dữ liệu có thể đến sau, và hai thông điệp có thể dính nhau.
    Dòng 30 còn gửi `4 + len` byte dù `buf` có thể chưa nhận đủ.
  fix: "Viết `recv_all(fd, buf, n)`: đọc đủ 4 byte, `ntohl`, rồi đọc đủ L byte trước khi xử lý và trả lời."

