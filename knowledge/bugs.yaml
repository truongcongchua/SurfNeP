# Bài "Tìm bug": mỗi mục là một bản sai trong problems/<problem>/wrong/<file>.
# lines = số dòng THẬT trong tệp (tệp có thể có chú thích "SAI..." bị ẩn khi hiển thị nhưng giữ nguyên số dòng).
# near  = dòng liên quan, chọn thêm vẫn không bị tính là chọn thừa.
# Đúng khi: chọn >= 1 dòng thuộc `lines`, không quá 5 dòng, không dòng nào ngoài lines + near.
# symptom = hiện trước khi trả lời (giống thông báo của bộ chấm). verdict = mã verdict điển hình.

- id: byte-order-host-order
  problem: byte-order
  file: host_order.c
  concept: byte-order
  lines: [12, 15]
  near: [13, 16]
  verdict: WA
  symptom: "Với `u16 4660` chương trình in `34 12 | 4660`, còn kết quả đúng là `12 34 | 13330`."
  title: Quên đổi sang network byte order
  explain: |-
    Dòng 12 và 15 gán thẳng `x = (uint16_t)v` / `(uint32_t)v` rồi đọc từng byte, nên thấy byte theo thứ tự của **máy** (little-endian: byte thấp trước), không phải thứ tự **mạng** (big-endian).
    Phần 3 của đề cũng sai theo: giá trị "máy đọc lại dãy byte đó" phải là giá trị của `htons`/`htonl`.
  fix: "`uint16_t x = htons((uint16_t)v);` và `uint32_t x = htonl((uint32_t)v);`"

- id: inet-addr-no-ntohl
  problem: inet-addr
  file: no_ntohl.c
  concept: byte-order
  lines: [13]
  near: [14, 15, 16]
  verdict: WA
  symptom: "`127.0.0.1` bị xếp loại `PUBLIC` thay vì `LOOPBACK`, và giá trị 32 bit in ra là `0x0100007F`."
  title: Dùng s_addr (thứ tự mạng) để so mặt nạ và in
  explain: |-
    `inet_pton` ghi `s_addr` theo **network order**. Trên máy little-endian, `127.0.0.1` nằm trong `s_addr` là `0x0100007F`, nên phép so `(a & 0xFF000000u) == 0x7F000000u` không bao giờ đúng.
    Cần chuyển về thứ tự máy trước khi so với mặt nạ hoặc in dạng `0xXXXXXXXX`.
  fix: "`uint32_t a = ntohl(in.s_addr);`"

- id: domain2ip-no-hints
  problem: domain2ip
  file: no_hints.c
  concept: socket-address
  lines: [14]
  near: [17, 18, 19, 20]
  verdict: WA
  symptom: "Mỗi IP bị in lặp 3 lần, và xuất hiện cả địa chỉ IPv6."
  title: Gọi getaddrinfo mà không đặt hints
  explain: |-
    Truyền `NULL` cho `hints` khiến `getaddrinfo` trả về **mọi** kiểu socket (STREAM, DGRAM, RAW) và cả IPv4 lẫn IPv6, nên mỗi địa chỉ xuất hiện nhiều lần.
    Phải đặt `ai_family = AF_INET` và `ai_socktype = SOCK_STREAM` để mỗi địa chỉ IPv4 chỉ có một nút.
  fix: "`struct addrinfo hints = {0}; hints.ai_family = AF_INET; hints.ai_socktype = SOCK_STREAM;` rồi truyền `&hints`."

- id: tcp-echo-exit-after-one
  problem: tcp-echo
  file: exit_after_one.c
  concept: tcp-lifecycle
  lines: [17, 22]
  near: [21]
  verdict: RE
  symptom: "Client thứ nhất được phục vụ bình thường, client thứ hai không kết nối được (server đã thoát)."
  title: accept nằm ngoài vòng lặp
  explain: |-
    `accept` chỉ được gọi **một lần** và sau khi phục vụ xong, hàm `main` `return 0`. Server lặp phải đặt `accept` **bên trong** `for (;;)` để quay lại nhận client tiếp theo.
  fix: "Bọc `accept ... close(c)` trong `for (;;) { ... }` và bỏ `return 0` khỏi vòng lặp."

- id: tcp-echo-strlen
  problem: tcp-echo
  file: strlen_echo.c
  concept: tcp-lifecycle
  lines: [23, 24]
  verdict: WA
  symptom: "Test nhị phân có byte `00 FF 41` chỉ nhận lại được 0 byte."
  title: Dùng strlen thay cho số byte recv trả về
  explain: |-
    Dữ liệu từ socket **không phải xâu C**: có thể chứa `0x00`. `strlen(buf)` dừng ở byte `0` đầu tiên nên chỉ gửi lại phần đứng trước nó.
    Phải dùng chính giá trị `n` mà `recv` trả về.
  fix: "`send(c, buf, (size_t)n, 0);` (không cần `buf[n] = 0`)."

- id: tcp-client-read-all-first
  problem: tcp-client-stdin
  file: read_all_first.c
  concept: tcp-lifecycle
  lines: [19, 20]
  near: [16, 17, 18]
  verdict: WA
  symptom: "Bộ chấm báo dòng thứ nhất đến muộn: client chỉ gửi sau khi stdin đã đóng."
  title: Đọc hết stdin rồi mới gửi
  explain: |-
    Vòng `read(0, ...)` chạy đến EOF rồi mới `send` một lần. Đề yêu cầu gửi **ngay khi có từng dòng**, nên người dùng gõ xong một dòng mà server chưa nhận được gì.
    Phải gửi trong vòng lặp đọc (mỗi dòng một lần `send`).
  fix: "Dùng `fgets` đọc từng dòng và `send(s, line, strlen(line), 0)` ngay trong vòng lặp."

- id: tcp-greeting-overwrite-log
