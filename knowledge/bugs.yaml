- id: nonblock-accept-blocking-clients
  problem: nonblock-accept
  file: blocking_clients.c
  concept: nonblocking
  lines: [18, 22, 25]
  verdict: BLOCKED
  symptom: "Client A kết nối rồi im lặng thì client B không được phục vụ (BLOCKED)."
  title: Chỉ socket nghe là non-blocking
  explain: |-
    Dòng 18 đặt `FIONBIO` cho `ls`, nhưng socket do `accept` trả về (`c`, dòng 22) vẫn **blocking**. Khi duyệt client, `recv` (dòng 25) chặn đến khi client đó gửi gì, làm đứng cả vòng lặp.
    Mỗi socket client cũng phải được đặt non-blocking, và `EAGAIN` phải được coi là "chưa có dữ liệu".
  fix: "Sau `accept`, gọi `ioctl(c, FIONBIO, &on)` (hoặc `fcntl O_NONBLOCK`), và xử lý `recv == -1 && errno == EAGAIN`."

- id: sv-struct-raw-struct
