  fix: "Đọc từng trường bằng `recv_all` (4 byte mssv, 1 byte nlen, nlen byte tên, ...), rồi `ntohl`/`ntohs`."

- id: udp-echo-zero-is-close
  problem: udp-echo
  file: zero_is_close.c
  concept: udp-basics
  lines: [18]
  verdict: RE
  symptom: "Sau khi client gửi một datagram rỗng, server thoát và các client sau không nhận được phản hồi."
  title: Coi recvfrom == 0 là đóng kết nối
  explain: |-
    Với TCP, `recv` trả `0` nghĩa là đối phương đã đóng. Với UDP **không có kết nối**: `recvfrom` trả `0` chỉ là một datagram **rỗng** hợp lệ.
    Chỉ nên thoát khi `n < 0` (lỗi), còn `n == 0` vẫn phải `sendto` lại một datagram rỗng.
  fix: "`if (n < 0) continue;` (hoặc xử lý lỗi) rồi `sendto(s, buf, n, ...)` kể cả khi `n == 0`."

