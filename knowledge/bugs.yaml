- id: fork-echo-no-waitpid
  problem: fork-echo
  file: no_waitpid.c
  concept: fork-server
  lines: [17, 19, 24]
  near: [25, 26]
  verdict: WA
  symptom: "Sau khi 10 client lần lượt rời đi, bộ chấm đếm được 10 tiến trình zombie."
  title: Không thu dọn tiến trình con
  explain: |-
    Tiến trình con kết thúc bằng `_exit(0)` nhưng không có ai gọi `wait`/`waitpid`, nên nó ở lại bảng tiến trình dưới dạng **zombie**.
    Cha phải đăng ký handler `SIGCHLD` chứa `while (waitpid(-1, NULL, WNOHANG) > 0);`.
  fix: "Trước vòng lặp: `signal(SIGCHLD, reap);` với `reap` gọi `waitpid(-1, NULL, WNOHANG)` trong vòng `while`."

- id: telnet-fork-parent-waits
  problem: telnet-fork
  file: parent_waits.c
  concept: fork-server
  lines: [138, 139]
  verdict: BLOCKED
  symptom: "Client A chạy `sleep 1.5` thì client B không nhận được `LOGIN OK` ngay (BLOCKED)."
  title: Cha chờ con xong mới accept tiếp
  explain: |-
    `while (wait(NULL) > 0)` ngay sau `fork` bắt tiến trình **cha** đứng chờ con kết thúc. Khi đó chỉ phục vụ được một client tại một thời điểm, giống server lặp, mất hết ý nghĩa của đa tiến trình.
    Cha phải quay lại `accept` ngay; việc thu dọn con để cho handler `SIGCHLD` làm.
  fix: "Bỏ vòng `wait` này; dùng handler `SIGCHLD` với `waitpid(-1, NULL, WNOHANG)` đã có sẵn."

