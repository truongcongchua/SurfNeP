  title: Server lặp, phục vụ xong client này mới accept client khác
  explain: |-
    Vòng `while (fgets(...))` ở dòng 32 chạy cho đến khi client hiện tại **đóng kết nối**, trong lúc đó chương trình không quay lại `accept` (dòng 28). Đề yêu cầu phục vụ đồng thời tối đa N client.
    Cần `select`/`poll` hoặc đa luồng (dùng chung bảng key-value nên không dùng fork).
  fix: "Dùng `select`/`poll` với bộ đệm riêng cho mỗi client, hoặc một luồng mỗi client + mutex bảo vệ bảng."

- id: kv-max-n-no-limit
  problem: kv-max-n
  file: no_limit.c
  concept: client-management
  lines: [107]
  near: [108, 109, 110, 115, 116]
  verdict: LIMIT
  symptom: "Với N = 2, client thứ 3 vẫn nhận được `WELCOME` thay vì `FULL` (LIMIT)."
  title: Điều kiện từ chối bị vô hiệu
  explain: |-
    Điều kiện `fd >= 0 && 0` **luôn sai**, nên nhánh gửi `FULL` rồi đóng không bao giờ chạy và mọi client đều được nhận. Đúng ra phải so số client đang kết nối với giới hạn: `nclients >= limit`.
  fix: "`if (fd >= 0 && nclients >= limit) { reply(fd, \"FULL\\n\"); close(fd); }`"

- id: select-echo-serve-until-close
  problem: select-echo
  file: serve_until_close.c
  concept: select-poll
  lines: [22, 23, 26]
  near: [21]
  verdict: BLOCKED
  symptom: "Client A kết nối rồi im lặng thì client B không được phục vụ (BLOCKED), dù chương trình có gọi `select`."
  title: Dùng select nhưng chỉ theo dõi socket nghe
  explain: |-
    `select` chỉ theo dõi `ls` (socket nghe), rồi `accept` xong thì **phục vụ client đó trong vòng `while (recv ...)` đến khi nó đóng kết nối**. Trong lúc đó chương trình không quay lại `select`, nên client khác không được phục vụ.
    Cần giữ **một tập fd gồm cả socket nghe lẫn mọi client**, mỗi vòng chỉ `recv` một lần ở fd sẵn sàng rồi quay lại `select`.
  fix: "Duy trì `fd_set master` chứa `ls` và các socket client; sau `select`, `accept` nếu `ls` sẵn sàng, còn lại `recv`/`send` một lần cho từng fd sẵn sàng."
